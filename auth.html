<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Living India</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth.css">
  </head>
  <body class="auth-hidden" id="auth-body">
    <div class="auth-container ornamental-border">
      <h2>Welcome Back</h2>
      <p class="subtitle">Continue your heritage journey.</p>
      
      <form id="login-form">
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
      </form>
      <div style="text-align: center; margin: 16px 0; color: #666; font-family: var(--font-sans); font-size: 14px;">OR</div>

<button id="google-login-btn" type="button" class="btn-primary" style="width: 100%; background-color: #fff; color: var(--text-dark); border: 1px solid var(--border-gold); display: flex; align-items: center; justify-content: center; gap: 12px;">
  <svg width="18" height="18" viewBox="0 0 48 48">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    <path fill="none" d="M0 0h48v48H0z"/>
  </svg>
  Continue with Google
</button>
      <div id="error-msg" style="color: var(--accent-terracotta); margin-top: 10px; text-align: center;"></div>
      
      <p style="text-align: center; margin-top: 24px; font-family: var(--font-sans); font-size: 14px;">
        <a href="/" style="color: var(--primary-teal);">← Back to Living India</a>
      </p>
    </div>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
