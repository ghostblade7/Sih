<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f3d"><title>Living India — My Profile</title><style>:root{--paper:#f5eddd;--paper2:#fbf7ee;--teal:#173f3d;--rust:#a84d35;--gold:#b88b3f;--muted:#6e746d;--line:#d6c4a1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#ead9bc,#f8efdf);color:#2b342f;font-family:Arial,sans-serif;padding:24px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:700;letter-spacing:4px;color:var(--teal)}.brand b{color:var(--rust)}button{cursor:pointer}.back{border:1px solid var(--line);background:var(--paper2);color:var(--teal);padding:10px 14px;font-weight:700;font-size:11px}.hero{background:var(--paper2);border:1px solid var(--gold);box-shadow:0 20px 60px #0001;overflow:hidden}.banner{height:190px;background:linear-gradient(135deg,var(--teal),#285d58,var(--rust));position:relative}.banner:after{content:'✺  ✦  ✺  ✦  ✺';position:absolute;right:30px;bottom:25px;color:#dcb45f;font-size:26px;letter-spacing:12px}.profile{display:grid;grid-template-columns:170px 1fr;gap:25px;padding:0 38px 38px}.avatar-wrap{margin-top:-70px}.avatar{width:140px;height:140px;border-radius:50%;border:7px solid var(--paper2);background:var(--teal);display:grid;place-items:center;color:#ddb35e;font:48px Georgia;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar.has-photo img{display:block}.avatar.has-photo span{display:none}.photo-btn{display:block;margin-top:10px;text-align:center;border:1px solid var(--gold);padding:8px;font-size:10px;color:var(--teal);cursor:pointer}.photo-help{font-size:9px;color:var(--muted);text-align:center;margin-top:5px}.eyebrow{margin-top:27px;color:var(--rust);font-size:10px;font-weight:700;letter-spacing:2px}.name{font:600 44px Georgia;color:var(--teal);margin:7px 0}.email{color:var(--muted);font-size:13px}.verified{display:inline-block;margin-top:12px;padding:7px 10px;background:#e6f0e4;color:#356b4e;font-size:10px;font-weight:700}.actions{display:flex;gap:8px;margin-top:22px}.primary,.secondary{padding:12px 16px;border:1px solid var(--teal);font-weight:700;font-size:11px}.primary{background:var(--teal);color:#fff}.secondary{background:var(--paper2);color:var(--teal)}.grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid var(--line);background:#f7efdf;padding:20px}.card .icon{font-size:24px;color:var(--rust)}.card h3{font:600 21px Georgia;color:var(--teal);margin:8px 0}.card p{font-size:12px;line-height:1.6;color:var(--muted)}.status{margin-top:14px;color:var(--rust);font-size:12px}input[type=file]{display:none}@media(max-width:700px){body{padding:0}.top{padding:18px}.profile{grid-template-columns:1fr;padding:0 22px 28px}.grid{grid-template-columns:1fr}.name{font-size:35px}.banner{height:150px}}</style></head><body><div class="wrap"><header class="top"><div class="brand">LIVING <b>INDIA</b></div><button class="back" id="home">← BACK TO LIVING INDIA</button></header><main class="hero"><div class="banner"></div><section class="profile"><div class="avatar-wrap"><div class="avatar" id="avatar"><img id="avatarImg" alt="Profile picture"><span>✦</span></div><label class="photo-btn" for="photoInput">📷 Change profile picture</label><input id="photoInput" type="file" accept="image/*"><div class="photo-help">JPG, PNG or WEBP · max 5 MB</div></div><div><div class="eyebrow">MY JOURNEY</div><h1 class="name" id="name">Loading…</h1><div class="email" id="email"></div><div class="verified" id="verified">Checking account…</div><div class="actions"><button class="primary" id="explore">Explore →</button><button class="secondary" id="signout">Sign out</button></div><div class="status" id="status"></div></div><div class="grid"><div class="card"><div class="icon">✦</div><h3>Heritage Passport</h3><p id="passport">Loading journey…</p></div><div class="card"><div class="icon">◈</div><h3>Saved Discoveries</h3><p id="saved">Loading saved discoveries…</p></div><div class="card"><div class="icon">♧</div><h3>Community Contributions</h3><p>Your moderation-ready contributions will appear here.</p></div></div></section></main></div><script type="module">import {auth,db} from './firebase.js';import {onAuthStateChanged,signOut} from 'firebase/auth';import {doc,getDoc} from 'firebase/firestore';const $=id=>document.getElementById(id),home=new URL('./',location.href).href;$('home').onclick=$('explore').onclick=()=>location.href=home;const photoKey='li-profile-photo';function loadPhoto(){const p=localStorage.getItem(photoKey);if(p){$('avatarImg').src=p;$('avatar').classList.add('has-photo')}}$('photoInput').onchange=()=>{const f=$('photoInput').files?.[0];if(!f)return;if(f.size>5*1024*1024||!f.type.startsWith('image/')){$('status').textContent='Please choose an image under 5 MB.';return}const r=new FileReader();r.onload=()=>{localStorage.setItem(photoKey,r.result);loadPhoto();$('status').textContent='Profile picture updated.'};r.readAsDataURL(f)};loadPhoto();onAuthStateChanged(auth,async user=>{if(!user){location.replace('./auth.html');return}$('name').textContent=user.displayName||user.email?.split('@')[0]||'Heritage Explorer';$('email').textContent=user.email||'';$('verified').textContent=user.emailVerified?'✓ EMAIL VERIFIED':'EMAIL NOT VERIFIED';if(!user.emailVerified){$('verified').style.background='#f7e7df';$('verified').style.color='#a84d35'}if(!$('avatar').classList.contains('has-photo'))$('avatar').querySelector('span').textContent=($('name').textContent[0]||'H').toUpperCase();const p=await getDoc(doc(db,'passport',user.uid));const d=p.exists()?p.data():{};$('passport').textContent=`${d.items||0} discoveries · ${d.stories||0} stories · ${d.experiences||0} experiences completed.`;const u=await getDoc(doc(db,'users',user.uid));const saved=u.exists()?(u.data().savedDiscoveries||[]):[];$('saved').textContent=`${saved.length} saved discovery${saved.length===1?'':'ies'}.`});$('signout').onclick=async()=>{await signOut(auth);location.replace(home)}</script></body></html>
